name: Build and Deploy

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files via Native SCP
        run: |
          # Compress the compiled build and API directory into a lightweight archive
          tar -czf deploy.tar.gz public_html/
          
          # Upload the archive straight to Hostinger via native Secure Copy on port 65002
          scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/
          
          # Connect via SSH, extract the files right into your subdomain folder, and clean up
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            tar -xzf ~/deploy.tar.gz -C ~/domains/teammavericks.org/public_html/main/ --strip-components=1
            rm ~/deploy.tar.gz
          "